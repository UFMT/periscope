name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Maven verify (unit tests)
        run: mvn -B clean verify

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Maven verify with IT profile
        run: mvn -B verify -Pit

  frontend:
    name: Frontend lint, unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: periscope-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: periscope-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest unit tests
        run: npm test
      - name: Production build
        run: npm run build

  dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    # NVD rate-limits runners without an API key; pom.xml fails check at CVSS >= 7.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run dependency-check
        run: mvn -B -DskipTests install org.owasp:dependency-check-maven:check -DossindexAnalyzerEnabled=false
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/dependency-check-report.html
            **/dependency-check-report.json
            target/dependency-check-report.*
          if-no-files-found: warn

  e2e:
    name: E2E Playwright (Docker WildFly + Mongo)
    runs-on: ubuntu-latest
    needs: [build, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: periscope-ui/package-lock.json

      - name: Start MongoDB 7 and Periscope container
        run: |
          docker network create periscope-e2e
          docker run -d --name periscope-mongo --network periscope-e2e mongo:7
          for i in $(seq 1 30); do
            if docker exec periscope-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker build -t periscope:ci .
          docker run -d --name periscope-app --network periscope-e2e -p 8080:8080 \
            -e MONGODB_URI=mongodb://periscope-mongo:27017 \
            -e MONGODB_DATABASE=Periscope \
            -e PERISCOPE_JWT_SECRET=ci-e2e-jwt-secret-key-at-least-32-bytes! \
            -e PERISCOPE_CORS_ORIGINS=http://localhost:8080 \
            periscope:ci

      - name: Wait for health, OpenAPI and SPA redirect
        run: |
          for i in $(seq 1 40); do
            code=$(curl -sf -o /tmp/health.json -w "%{http_code}" http://localhost:8080/periscope/rest/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"UP"' /tmp/health.json; then
              cat /tmp/health.json
              curl -sf -o /dev/null http://localhost:8080/openapi
              curl -sf -o /dev/null http://localhost:8080/periscope/app/
              exit 0
            fi
            sleep 3
          done
          docker logs periscope-app || true
          exit 1

      - name: Install Playwright Chromium
        working-directory: periscope-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: periscope-ui
        env:
          E2E_BASE_URL: http://localhost:8080/periscope/app/
        run: npm run test:e2e

      - name: Dump container logs on failure
        if: failure()
        run: docker logs --tail 200 periscope-app || true

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            periscope-ui/playwright-report
            periscope-ui/test-results
          if-no-files-found: ignore

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f periscope-app periscope-mongo || true
          docker network rm periscope-e2e || true
